<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>高規格道路 — チャット</title>
  <link rel="stylesheet" href="./chat-panel.css">
  <link rel="stylesheet" href="../shared/ui-theme.css">
</head>
<body class="chat-ui">
  <header>
    <div class="brand"><img src="../assets/img/icon48.png" width="28" height="28" alt=""><div><strong>学習チャット</strong><small>高規格道路</small></div></div>
    <div class="header-actions">
    <a id="open-chatgpt-web" class="icon-button web-link" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer" title="ChatGPTのWeb版を別タブで開く" aria-label="ChatGPTのWeb版を別タブで開く"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3h7v7m0-7L11 13"/><path d="M10 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"/></svg><span>Web版</span></a>
    <button id="new-chat" class="icon-button" title="新しいチャット" aria-label="新しいチャット"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>新規</span></button>
  <details id="connection" open>
    <summary title="アカウント設定"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span id="connection-label" class="sr-only">アカウント設定・未ログイン</span><span class="dot" id="connection-dot"></span></summary>
    <div class="settings">
      <div class="settings-heading"><h2>アカウント</h2><button id="close-settings" class="text-button" aria-label="アカウント設定を閉じる">閉じる</button></div>
      <div class="account-row"><span id="account-name">未ログイン</span><button id="logout" class="text-button" hidden>ログアウト</button></div>
      <p id="account-help">ChatGPTにログインして、会話を始めましょう。</p>
      <label for="account">ChatGPTアカウント</label>
      <select id="account"><option value="">別のアカウントを追加</option></select>
      <button id="login" data-oai-siwc-button disabled>ChatGPTでログイン</button>
      <p class="fine">ブラウザを閉じた後などは、再ログインが必要になる場合があります。</p>
      <div class="settings-links"><a href="https://chatgpt.com/#settings" target="_blank" rel="noopener noreferrer">利用状況・接続を管理 ↗</a><button id="refresh" class="text-button">接続を確認</button></div>
    </div>
  </details>
    </div>
  </header>
  <div class="model-row"><div class="model-picker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.4 6.6L21 12l-6.6 2.4L12 21l-2.4-6.6L3 12l6.6-2.4Z"/></svg><label for="model" class="sr-only">モデル</label><select id="model" disabled><option value="">モデルを選択</option></select></div><span id="session-state" class="session-state">未ログイン</span></div>
  <div class="history-row"><label for="chat-history">履歴</label><select id="chat-history" aria-label="保存したチャット"><option value="">新しいチャット</option></select><button id="delete-chat" type="button" class="text-button" disabled>削除</button></div>
  <p id="status" role="status" aria-live="polite">ChatGPTにログインしてください。</p>
  <main id="messages" role="log" aria-label="チャット履歴" aria-live="polite">
    <section id="welcome"><div class="welcome-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a8 8 0 0 1-8 8H5l-3 2v-10a9 9 0 0 1 18-1"/><path d="m17 2 1.3 3.7L22 7l-3.7 1.3L17 12l-1.3-3.7L12 7l3.7-1.3Z"/></svg></div><p class="eyebrow">YOUR STUDY COMPANION</p><h1>学びを、もう一歩。</h1><p class="welcome-description">気になったことを、そのまま言葉に。<br>授業の疑問も、考えの整理も。</p><div class="suggestions"><button data-prompt="難しい用語を、具体例を使ってわかりやすく説明してほしい"><span class="suggestion-symbol" aria-hidden="true">Aa</span><span><strong>用語を理解する</strong><small>具体例で、やさしく説明</small></span><span class="suggestion-arrow" aria-hidden="true">↗</span></button><button data-prompt="学んだ内容を整理したいので、要点をまとめるのを手伝って"><span class="suggestion-symbol" aria-hidden="true">≡</span><span><strong>考えを整理する</strong><small>大切なポイントをまとめる</small></span><span class="suggestion-arrow" aria-hidden="true">↗</span></button></div></section>
  </main>
  <footer>
    <form id="composer"><label class="sr-only" for="prompt">メッセージ</label><textarea id="prompt" rows="2" maxlength="16000" placeholder="ChatGPTに質問する…" disabled></textarea><div class="compose-actions"><span>Enterで送信 <span class="key-separator">/</span> Shift＋Enterで改行</span><button id="send" type="submit" disabled aria-label="送信"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button><button id="stop" type="button" hidden><span aria-hidden="true">■</span> 停止</button></div></form>
    <small>送信した会話のみを使用 · ページ内容は自動送信しません</small>
  </footer>
  <script src="./chat-history.js"></script>
  <script src="./chat-panel.js"></script>
</body>
</html>
