<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>高規格道路 — ログインを確認中</title>
  <link rel="stylesheet" href="chat-auth-result.css">
</head>
<body>
  <header class="brand"><img src="img/icon48.png" width="30" height="30" alt=""><span>高規格道路<small>学習チャット</small></span></header>
  <main>
    <section class="result-card" data-state="processing" aria-labelledby="result-title">
      <div class="result-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="icon-ring" cx="16" cy="16" r="12"/><path class="icon-check" d="m10 16 4 4 8-8"/><path class="icon-alert" d="M16 9v9m0 5h.01"/></svg></div>
      <div id="result-state" class="state-label">接続を確認中</div>
      <div class="result-copy" role="status" aria-live="polite" aria-atomic="true"><h1 id="result-title">もう少しで、準備完了です。</h1><p id="result-description">ChatGPTとの接続を確認しています。<br>このまま少しお待ちください。</p></div>
      <div id="result-account" class="account" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg><span id="result-email"></span><span class="account-check" aria-hidden="true">✓</span></div>
      <div class="actions"><button id="open-chat" type="button" disabled><span id="open-chat-label">接続を確認しています…</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button><button id="close-tab" type="button">このタブを閉じる</button></div>
      <p id="result-hint" class="hint">確認が終わると、ここからチャットを開けます。</p>
    </section>
  </main>
  <footer>高規格道路 <span aria-hidden="true">·</span> ChatGPT連携</footer>
  <script src="chat-auth-result.js"></script>
</body>
</html>
